<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agency OS</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#09090f;font-family:'Outfit',sans-serif;color:#eceaf8}
#splash,#app{position:fixed;inset:0;z-index:10}
#app{display:none;flex-direction:column}

#splash{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:32px;
  background:radial-gradient(ellipse 100% 60% at 50% 110%,rgba(74,144,255,.09),transparent),#09090f}
.sp-t{font-size:52px;font-weight:900;letter-spacing:-3px;background:linear-gradient(150deg,#fff 0%,rgba(255,255,255,.45));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sp-s{font-size:11px;letter-spacing:5px;text-transform:uppercase;color:rgba(236,234,248,.28);margin-bottom:4px}
.sp-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;max-width:820px;width:100%;padding:0 20px}
.sp-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:18px;padding:18px 10px 14px;cursor:pointer;transition:all .3s cubic-bezier(.34,1.5,.64,1);text-align:center;position:relative;overflow:hidden}
.sp-card:hover,.sp-card.sel{transform:translateY(-5px) scale(1.02);background:rgba(255,255,255,.06)}
.sp-card.sel{border-color:rgba(255,255,255,.28)}
.sp-glow{position:absolute;inset:0;border-radius:18px;opacity:0;transition:opacity .3s}
.sp-card.sel .sp-glow{opacity:1}
.sp-fig{width:60px;height:60px;margin:0 auto 12px;position:relative}
.sp-fig canvas{image-rendering:pixelated;border-radius:8px}
.sp-n{font-size:12px;font-weight:700;margin-bottom:2px}
.sp-r{font-size:9px;color:rgba(236,234,248,.4);margin-bottom:7px}
.sp-d{font-size:8px;font-weight:700;padding:3px 8px;border-radius:20px;letter-spacing:.5px;display:inline-block}
.sp-btn{padding:14px 48px;font-family:'Outfit',sans-serif;font-size:14px;font-weight:700;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:100px;color:#eceaf8;cursor:pointer;transition:all .3s}
.sp-btn:hover{background:rgba(255,255,255,.12)}.sp-btn:disabled{opacity:.2;cursor:not-allowed}

#topbar{height:52px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 18px;background:rgba(6,7,11,.88);border-bottom:1px solid rgba(255,255,255,.07);backdrop-filter:blur(40px);z-index:50}
.tb-hex{width:26px;height:26px;background:linear-gradient(135deg,#c8a84b,#e8c96a);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%);filter:drop-shadow(0 0 6px rgba(200,168,75,.5))}
.tb-title{font-size:14px;font-weight:700}.tb-div{width:1px;height:18px;background:rgba(255,255,255,.08)}
.tb-hint{font-size:11px;color:rgba(236,234,248,.3)}
.tb-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.mpill{display:flex;align-items:center;gap:7px;padding:5px 14px;background:rgba(200,168,75,.08);border:1px solid rgba(200,168,75,.2);border-radius:100px;cursor:pointer;transition:all .2s;font-size:12px;color:#e8c96a;font-weight:600}
.mpill:hover{background:rgba(200,168,75,.14)}
.mdot{width:5px;height:5px;border-radius:50%;background:#c8a84b;box-shadow:0 0 6px #c8a84b;animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.pp{display:flex;align-items:center;gap:7px;padding:3px 12px 3px 3px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:100px}
.pp-a{width:34px;height:34px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center}
.pp-a canvas{image-rendering:pixelated}
.pp-n{font-size:12px;font-weight:600}
#main{flex:1;display:flex;overflow:hidden}
#cw{flex:1;position:relative;overflow:hidden;background:#0d0e16}
#gc{display:block;image-rendering:pixelated}

/* Popup */
#pop{position:fixed;z-index:60;width:210px;background:rgba(8,9,16,.97);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:12px;backdrop-filter:blur(60px);box-shadow:0 20px 56px rgba(0,0,0,.7);opacity:0;pointer-events:none;transform:translateY(5px);transition:opacity .14s,transform .14s}
#pop.on{opacity:1;pointer-events:all;transform:translateY(0)}
.pop-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pop-ava{width:40px;height:40px;flex-shrink:0;image-rendering:pixelated;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center}
.pop-ava canvas{image-rendering:pixelated}
.pop-nm{font-size:13px;font-weight:700}.pop-rl{font-size:9px;color:rgba(236,234,248,.45);margin-top:1px}
.pop-txt{font-size:10px;color:rgba(236,234,248,.5);line-height:1.6;margin-bottom:8px}
.pop-tags{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:8px}
.ptag{font-size:8px;font-weight:700;padding:2px 6px;border-radius:20px}
.pop-btns{display:flex;gap:5px}
.pb{flex:1;padding:6px;border-radius:7px;font-size:10px;font-weight:700;cursor:pointer;border:none;font-family:'Outfit',sans-serif;transition:all .14s}
.pb.a{background:rgba(255,255,255,.88);color:#09090f}.pb.a:hover{background:#fff}
.pb.b{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#eceaf8}.pb.b:hover{background:rgba(255,255,255,.12)}

/* Panel */
#panel{width:280px;flex-shrink:0;background:rgba(6,7,11,.62);border-left:1px solid rgba(255,255,255,.07);backdrop-filter:blur(40px);display:flex;flex-direction:column;overflow:hidden}
.ptabs{display:flex;padding:8px 8px 0;gap:3px}
.ptt{flex:1;padding:7px;border-radius:8px;font-size:11px;font-weight:500;text-align:center;cursor:pointer;color:rgba(236,234,248,.4);border:1px solid transparent;background:none;font-family:'Outfit',sans-serif;transition:all .14s}
.ptt:hover{color:#eceaf8;background:rgba(255,255,255,.04)}.ptt.on{color:#eceaf8;background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.1)}
.pbody{flex:1;overflow-y:auto;padding:8px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.07) transparent}
.pbody::-webkit-scrollbar{width:2px}.pbody::-webkit-scrollbar-thumb{background:rgba(255,255,255,.07)}
.dh{display:flex;align-items:center;gap:6px;padding:7px 0 3px;margin-top:2px}
.dd{width:6px;height:6px;border-radius:50%}.dl{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase}.dc{margin-left:auto;font-size:9px;color:rgba(236,234,248,.22)}
.ar{display:flex;align-items:center;gap:8px;padding:5px 7px;border-radius:10px;cursor:pointer;transition:all .13s;border:1px solid transparent;margin-bottom:2px}
.ar:hover{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.07)}.ar.im{background:rgba(200,168,75,.05);border-color:rgba(200,168,75,.18)}
.ar-f{width:28px;height:28px;flex-shrink:0;image-rendering:pixelated;overflow:hidden;border-radius:6px;display:flex;align-items:center;justify-content:center}
.ar-i{flex:1;min-width:0}.ar-n{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ar-r{font-size:9px;color:rgba(236,234,248,.38)}
.ar-a{width:20px;height:20px;border-radius:6px;background:none;border:1px solid rgba(255,255,255,.1);color:rgba(236,234,248,.38);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .13s;flex-shrink:0;font-family:'Outfit',sans-serif}
.ar-a:hover{border-color:#c8a84b;color:#c8a84b}.ar-a.on{border-color:#c8a84b;color:#c8a84b;background:rgba(200,168,75,.1)}
.me{text-align:center;padding:36px 14px;color:rgba(236,234,248,.22);font-size:11px;line-height:2}
.ms{display:flex;align-items:center;gap:8px;padding:7px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:11px;margin-bottom:5px;position:relative;overflow:hidden}
.ms-b{position:absolute;left:0;top:0;bottom:0;width:2px}.ms-f{width:28px;height:28px;flex-shrink:0;image-rendering:pixelated;overflow:hidden;border-radius:6px;display:flex;align-items:center;justify-content:center}
.ms-i{flex:1}.ms-n{font-size:11px;font-weight:600}.ms-r{font-size:9px;color:rgba(236,234,248,.38)}
.ms-x{width:16px;height:16px;border-radius:5px;background:none;border:1px solid rgba(255,68,68,.2);color:rgba(255,68,68,.4);cursor:pointer;font-size:9px;display:flex;align-items:center;justify-content:center;transition:all .13s}
.ms-x:hover{background:rgba(255,68,68,.12);color:#ff4444;border-color:#ff4444}
.ml{width:100%;margin-top:8px;padding:11px;background:linear-gradient(135deg,rgba(200,168,75,.18),rgba(232,201,106,.07));border:1px solid rgba(200,168,75,.28);border-radius:10px;color:#e8c96a;font-family:'Outfit',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .22s}
.ml:hover:not(:disabled){box-shadow:0 0 28px rgba(200,168,75,.18)}.ml:disabled{opacity:.22;cursor:not-allowed}
.ic{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:13px;padding:13px;margin-bottom:7px}
.if{width:64px;height:64px;margin:0 auto 8px;image-rendering:pixelated;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.in{text-align:center;font-size:15px;font-weight:800}.ir{text-align:center;font-size:9px;font-weight:700;letter-spacing:.5px;margin-bottom:9px}
.isep{height:1px;background:rgba(255,255,255,.06);margin:8px 0}
.ilbl{font-size:8px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(236,234,248,.22);margin-bottom:5px}
.itxt{font-size:10px;color:rgba(236,234,248,.48);line-height:1.7}
.irule{font-size:10px;color:rgba(236,234,248,.48);padding:4px 0;display:flex;gap:6px;line-height:1.5;border-bottom:1px solid rgba(255,255,255,.03)}
.irule::before{content:'→';color:rgba(236,234,248,.22);flex-shrink:0}
.ibtn{width:100%;margin-top:8px;padding:8px;border-radius:9px;font-family:'Outfit',sans-serif;font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);color:#eceaf8}
.ibtn:hover{background:rgba(255,255,255,.09)}.ibtn.on{background:rgba(200,168,75,.1);border-color:rgba(200,168,75,.3);color:#e8c96a}

#amod{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:30px;background:rgba(5,6,10,.78);backdrop-filter:blur(20px)}
#amod.on{display:flex}
.amb{background:rgba(8,9,17,.97);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:20px;max-width:430px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 40px 100px rgba(0,0,0,.8);scrollbar-width:thin}
.am-t{display:flex;gap:12px;margin-bottom:15px;align-items:flex-start}
.am-fig{width:64px;height:64px;flex-shrink:0;border-radius:12px;overflow:hidden;image-rendering:pixelated;display:flex;align-items:center;justify-content:center}
.am-n{font-size:18px;font-weight:800;letter-spacing:-.5px}.am-d{font-size:10px;font-weight:700;letter-spacing:.5px;margin-top:2px}
.am-s{font-size:9px;color:rgba(236,234,248,.38);margin-top:4px;line-height:1.6;font-family:'JetBrains Mono',monospace}
.am-x{width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(236,234,248,.45);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;transition:all .13s}
.am-sl{font-size:8px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(236,234,248,.22);margin:12px 0 5px;padding-bottom:5px;border-bottom:1px solid rgba(255,255,255,.06)}
.am-id{font-size:11px;color:rgba(236,234,248,.52);line-height:1.7;font-style:italic;padding:8px;background:rgba(255,255,255,.03);border-radius:8px}
.am-ru{font-size:10px;color:rgba(236,234,248,.48);padding:4px 0;border-bottom:1px solid rgba(255,255,255,.03);display:flex;gap:7px;line-height:1.5}
.am-ru::before{content:'→';color:rgba(236,234,248,.22);flex-shrink:0}
.am-dl{font-size:10px;color:rgba(236,234,248,.48);padding:3px 0;display:flex;gap:7px}
.am-dl::before{content:'◇';font-size:8px;color:rgba(236,234,248,.22);flex-shrink:0;margin-top:2px}
.am-f{display:flex;gap:7px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.06)}
.ambt{flex:1;padding:10px;border-radius:9px;font-family:'Outfit',sans-serif;font-size:11px;font-weight:700;cursor:pointer;border:none;transition:all .2s}
.ambt.p{background:rgba(255,255,255,.88);color:#09090f}.ambt.p:hover{background:#fff}
.ambt.s{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#eceaf8}
.ambt.r{background:rgba(255,68,68,.1);border:1px solid rgba(255,68,68,.22);color:#ff7070}

#mov{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:40px;background:rgba(5,6,10,.96);backdrop-filter:blur(50px)}
#mov.on{display:flex}
.mo-l{font-size:10px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:#c8a84b;text-align:center}
.mo-h{font-size:36px;font-weight:900;letter-spacing:-2px;text-align:center}
.mo-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:740px}
.mo-c{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 8px;width:90px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:15px;cursor:pointer;transition:all .22s;overflow:hidden}
.mo-c:hover{border-color:rgba(255,68,68,.4);background:rgba(255,68,68,.06);transform:translateY(-2px)}
.mo-cf{width:44px;height:44px;image-rendering:pixelated;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.mo-cn{font-size:9px;font-weight:700;text-align:center;line-height:1.3}.mo-cr{font-size:8px;color:rgba(236,234,248,.38);text-align:center}
.mo-ta{width:100%;max-width:580px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);border-radius:15px;overflow:hidden}
.mo-tah{padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.07);font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(236,234,248,.28)}
.mo-ta textarea{width:100%;background:none;border:none;outline:none;color:#eceaf8;font-family:'Outfit',sans-serif;font-size:13px;padding:12px 14px;min-height:64px;resize:none;line-height:1.6}
.mo-ta textarea::placeholder{color:rgba(236,234,248,.18)}
.mo-taf{padding:8px 14px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:flex-end;gap:7px}
.mo-cp{padding:9px 20px;background:rgba(255,255,255,.88);border:none;border-radius:8px;color:#09090f;font-family:'Outfit',sans-serif;font-size:12px;font-weight:800;cursor:pointer;transition:all .2s}
.mo-cp:hover{background:#fff;transform:scale(1.02)}
.mo-cl{padding:9px 14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:8px;color:rgba(236,234,248,.45);font-family:'Outfit',sans-serif;font-size:12px;cursor:pointer}.mo-cl:hover{color:#eceaf8}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(14px);background:rgba(8,9,17,.95);border:1px solid rgba(255,255,255,.1);color:#eceaf8;font-size:12px;font-weight:500;padding:8px 18px;border-radius:100px;opacity:0;transition:all .22s;pointer-events:none;z-index:999;white-space:nowrap;backdrop-filter:blur(40px)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="splash">
  <div style="text-align:center"><div class="sp-s">Wassim Omran · Agency OS</div><div class="sp-t">Create Your Character</div></div>

  <div style="display:flex;gap:32px;align-items:flex-start;max-width:760px;width:100%;padding:0 20px">

    <!-- Live preview -->
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px;flex-shrink:0">
      <div style="width:100px;height:120px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:16px;display:flex;align-items:center;justify-content:center;overflow:hidden">
        <canvas id="previewCanvas" width="64" height="96" style="image-rendering:pixelated;width:80px;height:96px"></canvas>
      </div>
      <div style="font-size:11px;color:rgba(236,234,248,.3);text-align:center">Your character</div>
    </div>

    <!-- Config -->
    <div style="flex:1;display:flex;flex-direction:column;gap:14px">
      <!-- Name -->
      <div>
        <div style="font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(236,234,248,.35);margin-bottom:6px">Your Name</div>
        <input id="playerName" type="text" placeholder="Enter your name..." maxlength="20"
          style="width:100%;padding:10px 14px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);border-radius:10px;color:#eceaf8;font-family:Outfit,sans-serif;font-size:14px;font-weight:600;outline:none"
          oninput="updatePreview()">
      </div>
      <!-- Skin -->
      <div>
        <div style="font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(236,234,248,.35);margin-bottom:6px">Skin Tone</div>
        <div style="display:flex;gap:8px" id="skinPicker"></div>
      </div>
      <!-- Hair -->
      <div>
        <div style="font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(236,234,248,.35);margin-bottom:6px">Hair Color</div>
        <div style="display:flex;gap:8px" id="hairPicker"></div>
      </div>
      <!-- Hair style -->
      <div>
        <div style="font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(236,234,248,.35);margin-bottom:6px">Hair Style</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap" id="stylePicker"></div>
      </div>
      <!-- Shirt -->
      <div>
        <div style="font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(236,234,248,.35);margin-bottom:6px">Outfit Color</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap" id="shirtPicker"></div>
      </div>
    </div>
  </div>

  <button class="sp-btn" id="spBtn" onclick="go()" disabled>Enter the Office →</button>
</div>

<!-- Talk dialog -->
<div id="talkDlg" style="display:none;position:fixed;inset:0;z-index:90;align-items:flex-end;justify-content:center;padding-bottom:80px;background:rgba(0,0,0,.4);backdrop-filter:blur(4px)">
  <div style="width:100%;max-width:520px;background:rgba(8,10,20,.97);border:1px solid rgba(255,255,255,.14);border-radius:20px 20px 0 0;padding:20px 20px 0">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <div id="talkAva" style="width:44px;height:52px;overflow:hidden;image-rendering:pixelated;border-radius:8px;flex-shrink:0;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center"></div>
      <div>
        <div id="talkName" style="font-size:14px;font-weight:700"></div>
        <div id="talkRole" style="font-size:10px;color:rgba(236,234,248,.45)"></div>
      </div>
      <button onclick="closeTalk()" style="margin-left:auto;width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(236,234,248,.5);cursor:pointer;font-size:13px">✕</button>
    </div>
    <!-- Chat history -->
    <div id="talkHistory" style="height:180px;overflow-y:auto;margin-bottom:10px;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.07) transparent;padding-right:4px"></div>
    <!-- Input row -->
    <div style="display:flex;gap:8px;padding-bottom:16px">
      <input id="talkInput" type="text" placeholder="Say something..." maxlength="120"
        style="flex:1;padding:9px 13px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;color:#eceaf8;font-family:Outfit,sans-serif;font-size:13px;outline:none"
        onkeydown="if(event.key==='Enter')sendTalk()">
      <button onclick="sendTalk()"
        style="padding:9px 18px;background:rgba(255,255,255,.88);border:none;border-radius:10px;color:#09090f;font-family:Outfit,sans-serif;font-size:12px;font-weight:700;cursor:pointer">Send</button>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════
//  CHARACTER RENDERER — crisp squared canvas characters
//  Each character: 32×48 px logical, drawn at 2x scale
//  No SVG, no lag, pure canvas drawing calls
// ════════════════════════════════════════════════════════

const CHAR_W = 32, CHAR_H = 48; // logical
const CHAR_SCALE = 2;           // render at 2x

// Palette pools
const SKIN = ['#fde2b4','#f5c48a','#e8a060','#c87838','#9a5820','#6e3810'];
const HAIR_COL = ['#1a0800','#3d1500','#6b3010','#a05010','#c89020','#e8c860','#888','#2a2040','#4a0808'];
const SHIRT_COL = ['#1e3a6e','#6b21a8','#065f46','#9a1220','#92400e','#0f5188','#7e22ce','#0f766e','#1e4040','#8b2252'];
const PANT_COL = ['#1e293b','#0f172a','#312e81','#1c1917','#14532d','#2d1b1b'];
const HAIR_STYLE = ['short','fade','curly','bun','long','side'];

function h8(s, m) {
  let h = 5381;
  for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0;
  return h % m;
}

// Pre-generate character appearance config
function getAppearance(agent) {
  const id = agent.id;
  return {
    skin:   SKIN[h8(id+'sk', SKIN.length)],
    hair:   HAIR_COL[h8(id+'ha', HAIR_COL.length)],
    hStyle: HAIR_STYLE[h8(id+'hs', HAIR_STYLE.length)],
    shirt:  SHIRT_COL[h8(id+'sh', SHIRT_COL.length)],
    pants:  PANT_COL[h8(id+'pt', PANT_COL.length)],
    fem:    h8(id+'gn', 2) === 0,
    glasses:h8(id+'gl', 5) === 0,
    divCol: DIVS[agent.div]?.color || '#4a90ff',
  };
}

// ─────────────────────────────────────────
//  CORE DRAW FUNCTION — draws one character
//  onto any canvas context at (0,0)
//  Logical size: CHAR_W × CHAR_H
// ─────────────────────────────────────────
function drawChar(ctx, ap, state, tick) {
  const W = CHAR_W, H = CHAR_H;
  const S = 1; // pixel unit

  // Animation values
  const t = tick;
  const walkCycle = Math.sin(t * 0.22);
  const idleBob   = Math.sin(t * 0.06) * 0.5;
  const typePulse = Math.abs(Math.sin(t * 0.25));

  // Layout constants (in logical px)
  const cx = W / 2;
  const headSize = 12;  // square head width/height
  const headX = cx - headSize / 2;
  const headY = 4 + (state === 'idle' ? idleBob : 0);

  const bodyW = 14, bodyH = 14;
  const bodyX = cx - bodyW / 2;
  const bodyY = headY + headSize + 2;

  const legW = 5, legH = 10;
  const legLY = bodyY + bodyH;

  // ── SHADOW ──
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.beginPath();
  ctx.ellipse(cx, H - 3, 9, 3, 0, 0, Math.PI * 2);
  ctx.fill();

  // ── LEGS ──
  if (state === 'walking') {
    const la = walkCycle * 5;
    const ra = -walkCycle * 5;
    // Left leg
    ctx.fillStyle = ap.pants;
    ctx.save(); ctx.translate(bodyX + 2, legLY); ctx.rotate(la * Math.PI / 180);
    ctx.fillRect(0, 0, legW, legH); ctx.restore();
    // Right leg
    ctx.save(); ctx.translate(bodyX + bodyW - legW - 2, legLY); ctx.rotate(ra * Math.PI / 180);
    ctx.fillRect(0, 0, legW, legH); ctx.restore();
    // Shoes
    ctx.fillStyle = '#111';
    ctx.fillRect(bodyX + 1, legLY + legH - 1, legW + 2, 3);
    ctx.fillRect(bodyX + bodyW - legW - 3, legLY + legH - 1, legW + 2, 3);
  } else if (state === 'typing') {
    ctx.fillStyle = ap.pants;
    ctx.fillRect(bodyX + 2, legLY, legW, legH - 2);
    ctx.fillRect(bodyX + bodyW - legW - 2, legLY, legW, legH - 2);
    ctx.fillStyle = '#111';
    ctx.fillRect(bodyX + 1, legLY + legH - 3, legW + 2, 3);
    ctx.fillRect(bodyX + bodyW - legW - 3, legLY + legH - 3, legW + 2, 3);
  } else {
    ctx.fillStyle = ap.pants;
    ctx.fillRect(bodyX + 2, legLY, legW, legH);
    ctx.fillRect(bodyX + bodyW - legW - 2, legLY, legW, legH);
    ctx.fillStyle = '#111';
    ctx.fillRect(bodyX + 1, legLY + legH - 1, legW + 2, 3);
    ctx.fillRect(bodyX + bodyW - legW - 3, legLY + legH - 1, legW + 2, 3);
  }

  // ── BODY / SHIRT ──
  // Main shirt
  ctx.fillStyle = ap.shirt;
  ctx.fillRect(bodyX, bodyY, bodyW, bodyH);
  // Shirt highlight (top edge)
  ctx.fillStyle = 'rgba(255,255,255,.18)';
  ctx.fillRect(bodyX, bodyY, bodyW, 2);
  // Shirt shadow (bottom edge)
  ctx.fillStyle = 'rgba(0,0,0,.2)';
  ctx.fillRect(bodyX, bodyY + bodyH - 2, bodyW, 2);
  // Division badge dot
  ctx.fillStyle = ap.divCol;
  ctx.fillRect(bodyX + bodyW - 5, bodyY + 4, 3, 3);
  // Shirt collar notch
  ctx.fillStyle = ap.skin;
  ctx.fillRect(cx - 2, bodyY, 4, 3);

  // ── ARMS ──
  ctx.fillStyle = ap.skin;
  if (state === 'typing') {
    // Arms forward/down at keyboard
    const tap = typePulse * 2;
    ctx.fillRect(bodyX - 3, bodyY + 2, 4, 8 + tap);
    ctx.fillRect(bodyX + bodyW - 1, bodyY + 2, 4, 8 + tap);
    // Hands
    ctx.fillRect(bodyX - 4, bodyY + 9 + tap, 5, 4);
    ctx.fillRect(bodyX + bodyW, bodyY + 9 + tap, 5, 4);
  } else if (state === 'walking') {
    const swing = walkCycle * 6;
    ctx.fillRect(bodyX - 3, bodyY + 2 + swing, 4, 9);
    ctx.fillRect(bodyX + bodyW - 1, bodyY + 2 - swing, 4, 9);
  } else if (state === 'talking') {
    const wave = Math.sin(t * 0.18) * 4;
    ctx.fillRect(bodyX - 3, bodyY + 2, 4, 9);
    // Raised talking arm
    ctx.fillRect(bodyX + bodyW - 1, bodyY - 2 + wave, 4, 9);
  } else {
    ctx.fillRect(bodyX - 3, bodyY + 3, 4, 8);
    ctx.fillRect(bodyX + bodyW - 1, bodyY + 3, 4, 8);
  }

  // ── NECK ──
  ctx.fillStyle = ap.skin;
  ctx.fillRect(cx - 2, headY + headSize - 1, 4, 4);

  // ── HEAD ──
  // Head base (square with slight rounding via multiple rects)
  ctx.fillStyle = ap.skin;
  ctx.fillRect(headX + 1, headY, headSize - 2, headSize);
  ctx.fillRect(headX, headY + 1, headSize, headSize - 2);
  // Head shadow (right + bottom)
  ctx.fillStyle = shadeColor(ap.skin, -15);
  ctx.fillRect(headX + headSize - 2, headY + 2, 2, headSize - 3);
  ctx.fillRect(headX + 1, headY + headSize - 2, headSize - 2, 2);

  // ── HAIR ──
  ctx.fillStyle = ap.hair;
  const hs = ap.hStyle;
  if (hs === 'short' || hs === 'fade') {
    ctx.fillRect(headX, headY - 2, headSize, 5);
    ctx.fillRect(headX - 1, headY, 2, 6);
    ctx.fillRect(headX + headSize - 1, headY, 2, 6);
    if (hs === 'fade') {
      ctx.fillStyle = shadeColor(ap.hair, 20);
      ctx.fillRect(headX, headY - 3, headSize, 2);
    }
  } else if (hs === 'curly') {
    ctx.fillRect(headX - 1, headY - 3, headSize + 2, 6);
    ctx.fillRect(headX - 2, headY, 3, 7);
    ctx.fillRect(headX + headSize - 1, headY, 3, 7);
    // Curly bumps
    for (let i = 0; i < 4; i++) {
      ctx.fillRect(headX + i * 3, headY - 4, 2, 2);
    }
  } else if (hs === 'bun') {
    ctx.fillRect(headX, headY - 2, headSize, 4);
    ctx.fillRect(headX - 1, headY, 2, 5);
    // Bun circle
    ctx.fillStyle = ap.hair;
    ctx.fillRect(headX + headSize - 5, headY - 6, 7, 7);
    ctx.fillStyle = shadeColor(ap.hair, -20);
    ctx.fillRect(headX + headSize - 4, headY - 5, 5, 5);
  } else if (hs === 'long') {
    ctx.fillRect(headX - 1, headY - 2, headSize + 2, 4);
    ctx.fillRect(headX - 2, headY, 3, headSize + 6);
    ctx.fillRect(headX + headSize - 1, headY, 3, headSize + 6);
  } else { // side
    ctx.fillRect(headX - 1, headY - 2, headSize + 2, 4);
    ctx.fillRect(headX - 1, headY, 2, 6);
    ctx.fillRect(headX + headSize - 1, headY, 2, 6);
    ctx.fillRect(headX - 1, headY - 1, 6, 2);
  }

  // ── FACE ──
  const eyeY = headY + 4;
  const eyeLX = headX + 3, eyeRX = headX + headSize - 6;
  // Eye whites
  ctx.fillStyle = '#fff';
  ctx.fillRect(eyeLX, eyeY, 4, 4);
  ctx.fillRect(eyeRX, eyeY, 4, 4);
  // Iris
  const irisColors = ['#2a1a08','#1a2a38','#183018','#2a1028','#0a1830'];
  ctx.fillStyle = irisColors[h8(ap.skin + 'i', irisColors.length)];
  ctx.fillRect(eyeLX + 1, eyeY + 1, 2, 2);
  ctx.fillRect(eyeRX + 1, eyeY + 1, 2, 2);
  // Pupils
  ctx.fillStyle = '#000';
  ctx.fillRect(eyeLX + 1, eyeY + 1, 1, 1);
  ctx.fillRect(eyeRX + 1, eyeY + 1, 1, 1);
  // Eye glint
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.fillRect(eyeLX + 2, eyeY, 1, 1);
  ctx.fillRect(eyeRX + 2, eyeY, 1, 1);

  // Eyebrows
  ctx.fillStyle = ap.hair;
  if (state === 'typing') {
    ctx.fillRect(eyeLX, eyeY - 2, 4, 1);
    ctx.fillRect(eyeRX, eyeY - 2, 4, 1);
  } else {
    ctx.fillRect(eyeLX, eyeY - 2, 4, 1);
    ctx.fillRect(eyeRX, eyeY - 2, 4, 1);
  }

  // Nose (subtle)
  ctx.fillStyle = shadeColor(ap.skin, -12);
  ctx.fillRect(cx - 1, headY + 7, 1, 2);

  // Mouth
  const mouthY = headY + headSize - 4;
  ctx.fillStyle = shadeColor(ap.skin, -20);
  if (state === 'talking') {
    // Open mouth talking
    ctx.fillRect(cx - 2, mouthY, 4, 2);
    ctx.fillStyle = '#6b1a1a';
    ctx.fillRect(cx - 1, mouthY, 2, 1);
  } else if (state === 'typing') {
    // Focused expression - slight frown
    ctx.fillRect(cx - 2, mouthY, 2, 1);
    ctx.fillRect(cx, mouthY + 1, 2, 1);
  } else {
    // Slight smile
    ctx.fillRect(cx - 2, mouthY + 1, 2, 1);
    ctx.fillRect(cx, mouthY, 2, 1);
    ctx.fillRect(cx - 3, mouthY + 1, 1, 1);
    ctx.fillRect(cx + 2, mouthY + 1, 1, 1);
  }

  // Ear
  ctx.fillStyle = shadeColor(ap.skin, -8);
  ctx.fillRect(headX - 1, headY + 4, 2, 4);
  ctx.fillRect(headX + headSize - 1, headY + 4, 2, 4);

  // ── GLASSES (optional) ──
  if (ap.glasses) {
    ctx.strokeStyle = 'rgba(220,220,240,.75)';
    ctx.lineWidth = 0.8;
    ctx.strokeRect(eyeLX - 0.5, eyeY - 0.5, 5, 5);
    ctx.strokeRect(eyeRX - 0.5, eyeY - 0.5, 5, 5);
    ctx.beginPath();
    ctx.moveTo(eyeLX + 4.5, eyeY + 2);
    ctx.lineTo(eyeRX - 0.5, eyeY + 2);
    ctx.stroke();
  }
}

function shadeColor(hex, pct) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.min(255, (n >> 16) + pct));
  const g = Math.max(0, Math.min(255, ((n >> 8) & 0xff) + pct));
  const b = Math.max(0, Math.min(255, (n & 0xff) + pct));
  return `rgb(${r},${g},${b})`;
}

// ─────────────────────────────
// Pre-bake character into offscreen canvas for fast reuse
// Returns ImageBitmap-like canvas
// ─────────────────────────────
const charFrameCache = new Map();
function getCharFrame(agent, state, tick) {
  const bucket = (tick / 3) | 0; // quantize to reduce rerenders
  const key = agent.id + state + (bucket % 30);
  if (charFrameCache.has(key)) return charFrameCache.get(key);
  // Limit cache size
  if (charFrameCache.size > 400) {
    const firstKey = charFrameCache.keys().next().value;
    charFrameCache.delete(firstKey);
  }
  const oc = document.createElement('canvas');
  oc.width = CHAR_W * CHAR_SCALE;
  oc.height = CHAR_H * CHAR_SCALE;
  const octx = oc.getContext('2d');
  octx.imageSmoothingEnabled = false;
  octx.scale(CHAR_SCALE, CHAR_SCALE);
  drawChar(octx, getAppearance(agent), state, bucket * 3);
  charFrameCache.set(key, oc);
  return oc;
}

//  DESK SPOTS — one per NPC, exactly aligned with desk art
//  Desk art: 150×84 px, monitor centered.
//  Character stands at: deskX + 75 (center), deskY + 84 + CH_DRAW/2 (just behind front edge)
// ════════════════════════════════════════════════════════
const DESK_SPOTS = [];   // filled after ZONES defined
function buildDeskSpots() {
  const agentCounts = {};
  AGENTS.forEach(a => { agentCounts[a.div] = (agentCounts[a.div] || 0) + 1; });

  ZONES.slice(0, 8).forEach(z => {
    const count = agentCounts[z.id] || 0;
    if (!count) return;

    const DESK_W = 150, DESK_H = 84, LABEL_H = 86, PAD = 14, SPACING = 10;
    const innerW = z.w - PAD * 2;
    const innerH = z.h - LABEL_H - PAD * 2;

    // Max columns that physically fit
    const maxFitCols = Math.max(1, Math.floor((innerW + SPACING) / (DESK_W + SPACING)));

    // Choose the most columns that still allow all agents to fit vertically
    let cols = 1;
    for (let c = 1; c <= Math.min(count, maxFitCols, 6); c++) {
      const rows = Math.ceil(count / c);
      const neededH = rows * DESK_H + (rows - 1) * SPACING;
      if (neededH <= innerH) cols = c;
    }
    const rows = Math.ceil(count / cols);

    // Center the grid vertically (bias slightly toward top — looks more natural)
    const totalW = cols * DESK_W + (cols - 1) * SPACING;
    const totalH = rows * DESK_H + (rows - 1) * SPACING;
    const oy = Math.round(z.y + LABEL_H + PAD + Math.max(0, (innerH - totalH) / 2));

    for (let r = 0; r < rows; r++) {
      const rowCount = Math.min(cols, count - r * cols);
      const rowW = rowCount * DESK_W + (rowCount - 1) * SPACING;
      // Each row horizontally centered independently
      const ox = Math.round(z.x + PAD + (innerW - rowW) / 2);

      for (let c = 0; c < rowCount; c++) {
        const deskX = ox + c * (DESK_W + SPACING);
        const deskY = oy + r * (DESK_H + SPACING);
        DESK_SPOTS.push({
          x: deskX, y: deskY,
          charX: deskX + DESK_W / 2,
          charY: deskY + DESK_H + 4,
          div: z.id, color: z.color,
          agentName: null,
        });
      }
    }
  });
}

// Break activity chat lines
const BREAK_LINES = {
  coffee:  ['☕ Need this...','Coffee run!','Fuel up ☕','Anyone want one?','Caffeine acquired','Coffee #3 today'],
  stretch: ['Quick stretch 🧘','Standing desk time','My back 😅','Posture check!','RSI prevention 💪','BRB stretching'],

class NPC {
  constructor(agentData, charX, charY) {
    this.a = agentData;
    this.ap = getAppearance(agentData);
    this.dx = charX; this.dy = charY;
    this.x = charX; this.y = charY;
    this.tx = charX; this.ty = charY;
    this.state = 'typing';
    this.actMode = 'desk'; // desk | stretch | coffee | wander | crosschat | printer
    this.tick = Math.random() * 200;
    this.stateCD = 180 + Math.random() * 400;
    this.chatText = '';
    this.chatCD = 200 + Math.random() * 400;
    this.chatTimer = 0;
    this.spd = 1.2 + Math.random() * 0.6;
    this.zone = ZONES.find(z => z.id === agentData.div);
    this.inMeeting = false;
    this.meetSeat = null;
  }

  _emitChat(context) {
    const lines = BREAK_LINES[context] || [];
    if (!lines.length || Math.random() > 0.35) return;  // only 35% chance to actually say anything
    this.chatText = lines[(Math.random() * lines.length) | 0];
    this.chatTimer = 3000 + Math.random() * 1000;
    this.chatCD = 12000 + Math.random() * 10000;
  }

  _startBreak(all) {
    const r = Math.random();
    if (r < 0.20) {
      // Coffee break — walk to café area
      this.actMode = 'coffee';
      this.state = 'walking';
      this.tx = 2595 + Math.random() * 50;
      this.ty = 1345 + Math.random() * 25;
      this.stateCD = 380 + Math.random() * 320;
      this._emitChat('coffee');
    } else if (r < 0.36) {
      // Stretch near desk — just idle in place
      this.actMode = 'stretch';
      this.state = 'idle';
      this.stateCD = 100 + Math.random() * 140;
      this._emitChat('stretch');
    } else if (r < 0.52) {
      // Wander inside own zone
      this.actMode = 'wander';
      this.state = 'walking';
      if (this.zone) {
        this.tx = this.zone.x + 40 + Math.random() * (this.zone.w - 80);
        this.ty = this.zone.y + 50 + Math.random() * (this.zone.h - 100);
      }
      this.stateCD = 140 + Math.random() * 180;
      if (Math.random() < 0.15) this._emitChat('wander');
    } else if (r < 0.70) {
      // Chat with same-division colleague
      const same = all.filter(n => n !== this && n.a.div === this.a.div);
      if (same.length > 0) {
        const partner = same[(Math.random() * same.length) | 0];
        this.actMode = 'chat';
        this.state = 'walking';
        this.tx = partner.x + 28; this.ty = partner.y - 5;
        this.stateCD = 60;
        const self = this;
        setTimeout(() => {
          if (self.state !== 'walking' && self.state !== 'idle') return;
          self.state = 'talking';
          self.stateCD = 220 + Math.random() * 200;
          if (partner.state !== 'typing') partner.state = 'talking';
        }, 500);
      } else {
        this.actMode = 'wander'; this.state = 'idle'; this.stateCD = 100;
      }
    } else if (r < 0.84) {
      // Cross-department visit
      const others = all.filter(n => n !== this && n.a.div !== this.a.div && !n.inMeeting);
      if (others.length > 0) {
        const target = others[(Math.random() * others.length) | 0];
        this.actMode = 'crosschat';
        this.state = 'walking';
        this.tx = target.x + 26; this.ty = target.y - 5;
        this.stateCD = 60;
        const self = this;
        setTimeout(() => {
          if (self.state !== 'walking' && self.state !== 'idle') return;
          self.state = 'talking';
          self.stateCD = 180 + Math.random() * 180;
          if (target.state !== 'typing') target.state = 'talking';
          if (Math.random() < 0.3) self._emitChat('collab');
        }, 700);
      } else {
        this.actMode = 'wander'; this.state = 'idle'; this.stateCD = 100;
      }
    } else {
      // Printer run
      this.actMode = 'printer';
      this.state = 'walking';
      this.tx = 1305 + Math.random() * 35;
      this.ty = 1085 + Math.random() * 28;
      this.stateCD = 260 + Math.random() * 220;
      this._emitChat('printer');
    }
  }

  update(dt, all) {
    this.tick += dt * 0.06;
    this.stateCD -= dt;
    this.chatCD -= dt;
    this.chatTimer = Math.max(0, this.chatTimer - dt);

    // Frozen in meeting seat
    if (this.inMeeting && this.meetSeat) {
      const distToSeat = Math.hypot(this.x - this.meetSeat.x, this.y - this.meetSeat.y);
      if (distToSeat > 8) {
        this.state = 'walking';
        this.tx = this.meetSeat.x; this.ty = this.meetSeat.y;
        const ddx = this.tx - this.x, ddy = this.ty - this.y;
        const dist = Math.sqrt(ddx*ddx+ddy*ddy)||1;
        this.x += (ddx/dist)*this.spd*dt*0.1;
        this.y += (ddy/dist)*this.spd*dt*0.1;
      } else {
        this.x = this.meetSeat.x; this.y = this.meetSeat.y;
        this.state = Math.random() < 0.3 ? 'talking' : 'idle';
        this.stateCD = 120 + Math.random() * 180;
      }
      if (this.chatCD <= 0 && Math.random() < 0.004) {
        const lines = CHAT_LINES[this.a.div] || ['...'];
        this.chatText = lines[(Math.random() * lines.length) | 0];
        this.chatTimer = 3000; this.chatCD = 8000 + Math.random() * 6000;
      }
      if (this.chatTimer <= 0) this.chatText = '';
      return;
    }

    // Work-related chat at desk
    if (this.chatCD <= 0 && (this.state === 'typing' || this.state === 'talking') && Math.random() < 0.004) {
      const lines = CHAT_LINES[this.a.div] || ['...'];
      this.chatText = lines[(Math.random() * lines.length) | 0];
      this.chatTimer = 3000 + Math.random() * 1000;
      this.chatCD = 10000 + Math.random() * 8000;
    }

    // Move toward walk target
    if (this.state === 'walking') {
      const ddx = this.tx - this.x, ddy = this.ty - this.y;
      const dist = Math.sqrt(ddx*ddx + ddy*ddy);
      if (dist < 3) {
        this.x = this.tx; this.y = this.ty;
        this.stateCD = 0; // arrived — trigger state change
      } else {
        this.x += (ddx/dist)*this.spd*dt*0.1;
        this.y += (ddy/dist)*this.spd*dt*0.1;
      }
    }

    // State machine decision
    if (this.stateCD <= 0) {
      const r = Math.random();
      if (r < 0.45) {
        // Return to desk and type
        this.actMode = 'desk';
        const far = Math.hypot(this.x - this.dx, this.y - this.dy) > 10;
        if (far) {
          this.state = 'walking';
          this.tx = this.dx; this.ty = this.dy;
        } else {
          this.x = this.dx; this.y = this.dy;
          this.state = 'typing';
        }
        this.stateCD = 400 + Math.random() * 600;
      } else if (r < 0.58) {
        // Extend typing time at desk
        this.actMode = 'desk';
        this.state = 'typing';
        this.x = this.dx; this.y = this.dy;
        this.stateCD = 280 + Math.random() * 360;
      } else {
        // Take a break
        this._startBreak(all);
      }
    }

    if (this.chatTimer <= 0) this.chatText = '';
  }
}

//  OFFICE RENDERING
// ════════════════════════════════════════════════════════
function renderOffice(ctx, camX, camY, W, H) {
  // Floor
  ctx.fillStyle = '#c8b080';
  ctx.fillRect(0, 0, W, H);

  const pH = 40, pW = 160;
  for (let y = (-camY % pH) - pH; y < H + pH; y += pH) {
    const row = Math.floor((y + camY) / pH);
    ctx.fillStyle = row % 2 === 0 ? 'rgba(0,0,0,.03)' : 'rgba(255,255,255,.02)';
    ctx.fillRect(0, y, W, pH);
    ctx.fillStyle = 'rgba(150,110,55,.18)';
    ctx.fillRect(0, y, W, 1);
    for (let x = (-camX % pW) - pW + (row % 2) * 80; x < W + pW; x += pW) {
      ctx.fillStyle = 'rgba(150,110,55,.1)';
      ctx.fillRect(x, y, 1, pH);
    }
  }

  // Ambient ceiling light pools
  for (let lx = 300; lx < FW; lx += 400) {
    for (let ly = 250; ly < FH; ly += 380) {
      const px = lx - camX, py = ly - camY;
      if (px < -300 || px > W + 300 || py < -300 || py > H + 300) continue;
      const g = ctx.createRadialGradient(px, py, 20, px, py, 180);
      g.addColorStop(0, 'rgba(255,240,190,.1)');
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(px, py, 180, 0, Math.PI * 2); ctx.fill();
    }
  }

  // Zones
  ZONES.forEach(z => {
    const zx = z.x - camX, zy = z.y - camY;
    if (zx + z.w < -10 || zy + z.h < -10 || zx > W + 10 || zy > H + 10) return;
    const col = z.color;

    if (z.id === 'meeting') {
      ctx.fillStyle = '#14112a';
      rr(ctx, zx, zy, z.w, z.h, 16); ctx.fill();
      ctx.fillStyle = 'rgba(20,16,40,.4)';
      for (let sy = 0; sy < z.h; sy += 16) ctx.fillRect(zx, zy + sy, z.w, 8);
    } else {
      ctx.fillStyle = col + '0c';
      rr(ctx, zx, zy, z.w, z.h, 16); ctx.fill();
    }

    // Glass wall top
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(zx, zy, z.w, 1.5);
    ctx.fillStyle = col + '3a'; ctx.fillRect(zx, zy, z.w, 4);
    ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(zx, zy, 1.5, z.h);
    ctx.fillStyle = col + '28'; ctx.fillRect(zx, zy, 4, z.h);
    ctx.fillStyle = 'rgba(0,0,0,.1)'; ctx.fillRect(zx, zy + z.h - 2, z.w, 2); ctx.fillRect(zx + z.w - 2, zy, 2, z.h);

    // Corner brackets
    ctx.strokeStyle = col + '90'; ctx.lineWidth = 1.8;
    const bl = 18;
    [[zx,zy,1,1],[zx+z.w,zy,-1,1],[zx,zy+z.h,1,-1],[zx+z.w,zy+z.h,-1,-1]].forEach(([px,py,dx,dy]) => {
      ctx.beginPath(); ctx.moveTo(px+dx*bl, py); ctx.lineTo(px, py); ctx.lineTo(px, py+dy*bl); ctx.stroke();
    });

    // Zone label header — name + subtitle + member count
    const ZONE_SUBS = {engineering:'Software & DevOps',accusentry:'Quality Control',paivo:'Product & Growth',marketing:'Brand & Content',support:'Finance & Analytics',design:'UI/UX & Brand',sales:'Business Dev',specialized:'Cross-Functional',meeting:'Conference Zone',dance:'Break Zone'};
    const sub = ZONE_SUBS[z.id] || '';
    const mc = AGENTS.filter(a => a.div === z.id).length;
    const chipW = Math.min(z.w - 20, 210), chipH = 42;
    const cx0 = zx + 10, cy0 = zy + 8;
    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,.45)'; rr(ctx, cx0+2, cy0+3, chipW, chipH, 7); ctx.fill();
    // Background
    ctx.fillStyle = 'rgba(4,5,14,.92)'; rr(ctx, cx0, cy0, chipW, chipH, 7); ctx.fill();
    // Tinted overlay
    ctx.fillStyle = col + '25'; rr(ctx, cx0, cy0, chipW, chipH, 7); ctx.fill();
    // Left accent bar
    ctx.fillStyle = col; ctx.fillRect(cx0, cy0+4, 4, chipH-8);
    // Division name
    ctx.font = 'bold 12px Outfit'; ctx.textBaseline = 'top'; ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,255,255,.96)';
    ctx.fillText(z.label, cx0 + 12, cy0 + 7);
    // Subtitle
    ctx.font = '8.5px Outfit'; ctx.fillStyle = col + 'cc';
    ctx.fillText(sub.toUpperCase(), cx0 + 12, cy0 + 24);
    // Member count badge
    if (mc > 0) {
      ctx.textAlign = 'right'; ctx.font = 'bold 8px Outfit';
      ctx.fillStyle = 'rgba(255,255,255,.28)';
      ctx.fillText(mc + ' agents', cx0 + chipW - 8, cy0 + 17);
    }
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';

    // Light bar
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(zx + z.w/2 - 48, zy, 96, 3);
    for (let li = -28; li <= 28; li += 14) {
      ctx.fillStyle = 'rgba(255,248,210,.8)';
      ctx.beginPath(); ctx.arc(zx + z.w/2 + li, zy + 1.5, 3, 0, Math.PI*2); ctx.fill();
    }
  });

  // Desks — drawn at exact DESK_SPOTS positions, with name plates
  DESK_SPOTS.forEach(ds => {
    const ddx = ds.x - camX, ddy = ds.y - camY;
    drawDesk(ctx, ddx, ddy, ds.color, W, H);
    if (ds.agentName) {
      ctx.font = 'bold 7.5px Outfit'; ctx.textBaseline = 'top'; ctx.textAlign = 'center';
      // Name plate strip
      const nw = 80, nh = 11, nx = ddx + 35, ny = ddy + 85;
      ctx.fillStyle = 'rgba(0,0,0,.55)'; rr(ctx, nx, ny, nw, nh, 3); ctx.fill();
      ctx.fillStyle = ds.color + 'dd';
      ctx.fillText(ds.agentName, nx + nw/2, ny + 2);
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    }
  });

  // Meeting table
  drawMeetingTable(ctx, camX, camY);

  // Zone inner rugs
  const rugZones = [
    {x:120,y:100,w:560,h:440,col:'#4a90ff'},
    {x:800,y:100,w:480,h:440,col:'#ff8c3a'},
    {x:120,y:670,w:560,h:500,col:'#2ee8a5'},
    {x:800,y:670,w:480,h:260,col:'#ff5090'},
    {x:800,y:1040,w:480,h:220,col:'#78e040'},
    {x:1520,y:100,w:400,h:440,col:'#b060ff'},
    {x:1520,y:670,w:400,h:260,col:'#ff4444'},
    {x:1520,y:1040,w:400,h:220,col:'#60a0ff'},
  ];
  rugZones.forEach(r => {
    const rx=r.x-camX,ry=r.y-camY;
    ctx.fillStyle=r.col+'08';rr(ctx,rx,ry,r.w,r.h,10);ctx.fill();

function rr(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

function renderChar(ctx, npc, camX, camY) {
  const sx = npc.x - camX - CW_DRAW / 2;
  const sy = npc.y - camY - CH_DRAW;
  if (sx + CW_DRAW < -20 || sy + CH_DRAW < -20 || sx > W + 20 || sy > H + 20) return;

  const d = DIVS[npc.a.div];
  const inM = meeting.find(m => m.id === npc.a.id);
  const isH = hovA?.id === npc.a.id;

  // Shadow ellipse
  ctx.fillStyle = 'rgba(0,0,0,.22)';
  ctx.beginPath(); ctx.ellipse(sx + CW_DRAW/2, sy + CH_DRAW + 2, CW_DRAW*.38, 5, 0, 0, Math.PI*2); ctx.fill();

  // Glow
  if (inM || isH) {
    const col = inM ? 'rgba(200,168,75,.22)' : d.color + '22';
    const g = ctx.createRadialGradient(sx+CW_DRAW/2, sy+CH_DRAW/2, 6, sx+CW_DRAW/2, sy+CH_DRAW/2, 52);
    g.addColorStop(0, col); g.addColorStop(1, 'transparent');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx+CW_DRAW/2, sy+CH_DRAW/2, 52, 0, Math.PI*2); ctx.fill();
  }

  // Character sprite from cache
  const frame = getCharFrame(npc.a, npc.state, npc.tick);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(frame, sx, sy, CW_DRAW, CH_DRAW);

  // Nametag
  const tW = 72, tH = 18;
  const tX = sx + CW_DRAW/2 - tW/2, tY = sy - tH - 4;
  ctx.fillStyle = 'rgba(4,5,10,.92)'; rr(ctx, tX, tY, tW, tH, 5); ctx.fill();
  ctx.strokeStyle = isH ? d.color + '88' : 'rgba(255,255,255,.07)';
  ctx.lineWidth = .8; rr(ctx, tX, tY, tW, tH, 5); ctx.stroke();
  if (isH) { ctx.fillStyle = d.color; ctx.fillRect(tX, tY, 2, tH); }
  ctx.fillStyle = isH ? 'rgba(255,255,255,.94)' : 'rgba(236,234,248,.72)';
  ctx.font = `${isH?'600':'500'} 9px Outfit`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(npc.a.name, sx + CW_DRAW/2, tY + tH/2);

  // State dot
  const dotCol = {typing: d.color, walking:'#60a0ff', talking:'#ffb060', idle:'#666'}[npc.state] || '#666';
  ctx.fillStyle = dotCol;
  ctx.beginPath(); ctx.arc(tX + tW - 5, tY + 5, 2.5, 0, Math.PI*2); ctx.fill();

  if (inM) {
    ctx.fillStyle = '#c8a84b'; ctx.font = '9px serif';
    ctx.fillText('★', sx + CW_DRAW - 2, sy + 3);
  }
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

function renderPlayer(ctx, camX, camY) {
  const sx = plX - camX - CW_DRAW/2, sy = plY - camY - CH_DRAW;
  ctx.fillStyle = 'rgba(0,0,0,.2)';
  ctx.beginPath(); ctx.ellipse(sx+CW_DRAW/2, sy+CH_DRAW+2, CW_DRAW*.4, 6, 0, 0, Math.PI*2); ctx.fill();
  const pg = ctx.createRadialGradient(sx+CW_DRAW/2, sy+CH_DRAW/2, 8, sx+CW_DRAW/2, sy+CH_DRAW/2, 62);
  pg.addColorStop(0,'rgba(200,168,75,.22)'); pg.addColorStop(1,'transparent');
  ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(sx+CW_DRAW/2, sy+CH_DRAW/2, 62, 0, Math.PI*2); ctx.fill();

  // Draw player using playerAp directly
  const frame = (() => {
    const bucket = (plTick / 3) | 0;
    const key = '__player__' + plState + (bucket % 30);
    if (charFrameCache.has(key)) return charFrameCache.get(key);
    const oc = document.createElement('canvas');
    oc.width = CW_DRAW; oc.height = CH_DRAW;
    const octx = oc.getContext('2d');
    octx.imageSmoothingEnabled = false;
    octx.scale(CHAR_SCALE, CHAR_SCALE);
    drawChar(octx, playerAp, plState, bucket * 3);
    if (charFrameCache.size > 400) charFrameCache.delete(charFrameCache.keys().next().value);
    charFrameCache.set(key, oc);
    return oc;
  })();

  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(frame, sx, sy, CW_DRAW, CH_DRAW);

  // Gold crown/star above to make player special
  ctx.fillStyle = '#e8c96a';
  ctx.font = 'bold 13px serif';
  ctx.textAlign = 'center';
  ctx.fillText('★', sx + CW_DRAW/2, sy - 2);

  // Player tag
  const tW=68,tH=24,tX=sx+CW_DRAW/2-tW/2,tY=sy-tH-8;
  ctx.fillStyle='rgba(4,5,10,.94)'; rr(ctx,tX,tY,tW,tH,7); ctx.fill();
  ctx.strokeStyle='rgba(200,168,75,.6)'; ctx.lineWidth=1.5; rr(ctx,tX,tY,tW,tH,7); ctx.stroke();
  ctx.fillStyle='rgba(200,168,75,.95)'; ctx.font='bold 8px Outfit'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('YOU', sx+CW_DRAW/2, tY+9);
  ctx.fillStyle='rgba(236,234,248,.7)'; ctx.font='500 8px Outfit';
  ctx.fillText(player.name, sx+CW_DRAW/2, tY+19);
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';

  // Dance / player chat bubble
  if (plChatText && plChatTimer > 0) {
    const bx = Math.round(sx + CW_DRAW / 2);
    const by = Math.round(sy - tH - 16);
    ctx.font = '600 11px Outfit';
    const bw = Math.min(180, ctx.measureText(plChatText).width + 28);
    const bh = 26;
    const bl = bx - bw / 2;
    const bt = by - bh;
    const alpha = plChatTimer < 800 ? plChatTimer / 800 : 1;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(8,10,20,.97)'; rr(ctx, bl, bt, bw, bh, 10); ctx.fill();
    ctx.strokeStyle = '#e8c96acc'; ctx.lineWidth = 1.5; rr(ctx, bl, bt, bw, bh, 10); ctx.stroke();
    // Tail
    ctx.fillStyle = 'rgba(8,10,20,.97)';
    ctx.beginPath(); ctx.moveTo(bx-6, bt+bh); ctx.lineTo(bx+6, bt+bh); ctx.lineTo(bx, bt+bh+8); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.92)'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(plChatText, bx, bt + bh/2);
    ctx.globalAlpha = 1;
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }
}

// ════════════════════════════════════════════════════════
//  SPEECH BUBBLES — drawn on canvas, readable, persistent
// ════════════════════════════════════════════════════════
function drawBubbles(ctx, camX, camY) {
  npcs.forEach(npc => {
    if (!npc.chatText || npc.chatTimer <= 0) return;

    const bx = Math.round(npc.x - camX);
    const by = Math.round(npc.y - camY - CH_DRAW - 12);

    // Measure text
    ctx.font = '600 11px Outfit';
    const lines = wrapText(ctx, npc.chatText, 140);
    const lineH = 16;
    const padX = 12, padY = 8;
    const bw = Math.min(160, ctx.measureText(npc.chatText).width + padX * 2 + 8);
    const bh = lines.length * lineH + padY * 2;
    const bl = bx - bw / 2;
    const bt = by - bh;

    // Fade in final 800ms
    const alpha = npc.chatTimer < 800 ? npc.chatTimer / 800 : 1;
    ctx.globalAlpha = alpha;

    // Bubble background
    ctx.fillStyle = 'rgba(8,10,20,.97)';
    rr(ctx, bl, bt, bw, bh, 10);
    ctx.fill();

    // Bubble border — division color
    const divCol = DIVS[npc.a.div]?.color || '#fff';
    ctx.strokeStyle = divCol + 'cc';
    ctx.lineWidth = 1.5;
    rr(ctx, bl, bt, bw, bh, 10);
    ctx.stroke();

    // Left color bar
    ctx.fillStyle = divCol;
    ctx.fillRect(bl, bt + 10, 3, bh - 20);

    // Tail pointing down to character
    ctx.fillStyle = 'rgba(8,10,20,.97)';
    ctx.beginPath();
    ctx.moveTo(bx - 5, bt + bh);
    ctx.lineTo(bx + 5, bt + bh);
    ctx.lineTo(bx, bt + bh + 7);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = divCol + 'cc';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(bx - 5, bt + bh + 1);
    ctx.lineTo(bx, bt + bh + 8);
    ctx.lineTo(bx + 5, bt + bh + 1);
    ctx.stroke();

    // Text
    ctx.fillStyle = '#f0eeff';
    ctx.font = '600 11px Outfit';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    lines.forEach((line, i) => {
      ctx.fillText(line, bx, bt + padY + lineH * i + lineH / 2);
    });

    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  });
}

function wrapText(ctx, text, maxW) {
  const words = text.split(' ');
  const lines = [];
  let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && cur) {
      lines.push(cur); cur = w;
    } else { cur = test; }
  }
  if (cur) lines.push(cur);
  return lines;
}

function makeSmallCanvas(agent, size) {
  const oc = document.createElement('canvas');
  oc.width = oc.height = size;
  const octx = oc.getContext('2d');
  octx.imageSmoothingEnabled = false;
  const sc = size / CHAR_W;
  octx.scale(sc, sc * (CHAR_W / CHAR_H));
  drawChar(octx, getAppearance(agent), 'idle', 60);
  return oc;
}

function init() {
  canvas = document.getElementById('gc');
  ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  resize();
  window.addEventListener('resize', resize);

  // Build desk spots — guaranteed one desk per agent
  buildDeskSpots();

  // Assign each agent their own desk slot (expand grid if needed)
  const byDiv = {};
  AGENTS.forEach(a => { if (!byDiv[a.div]) byDiv[a.div] = []; byDiv[a.div].push(a); });

  Object.entries(byDiv).forEach(([div, list]) => {
    const z = ZONES.find(z => z.id === div);
    if (!z) return;
    const spots = DESK_SPOTS.filter(ds => ds.div === div);

    list.forEach((a, i) => {
      // If we have a pre-computed spot, use it; otherwise synthesize a position
      let charX, charY;
      if (i < spots.length) {
        charX = spots[i].charX;
        charY = spots[i].charY;
        spots[i].agentName = a.name;
      } else {
        // Overflow: place extra agents in a row below existing desks
        const overflowRow = Math.floor(i / 4);
        const overflowCol = i % 4;
        charX = z.x + 55 + 150/2 + overflowCol * 185;
        charY = z.y + 50 + 44 + 84 + 4 + overflowRow * 170 + (Math.ceil(spots.length / 4)) * 170;
        // Also add a desk for this overflow spot
        DESK_SPOTS.push({ x: charX - 75, y: charY - 88, charX, charY, div, color: z.color });
      }
      npcs.push(new NPC(a, charX, charY));
    });
  });

  plX = FW / 2; plY = FH / 2;
  camX = plX - W / 2; camY = plY - H / 2;

  window.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'Escape') {
      cmod({ target: document.getElementById('amod') });
      closeMov();
      closeTalk();
    }
    // E = talk to nearby agent
    if (e.code === 'KeyE' && nearbyNPC && !talkTarget) {
      openTalk(nearbyNPC);
    }
    // M = open meeting modal
    if (e.code === 'KeyM') {
      if (document.getElementById('mov').classList.contains('on')) { closeMov(); }
      else { openMov(); }
    }
    // D = dance anywhere
    if (e.code === 'KeyD') {
      plDancing = true;
      plDanceTimer = 4000;
      plChatText = DANCE_LINES[(Math.random() * DANCE_LINES.length) | 0];
      plChatTimer = 3500;
    }
  });
  window.addEventListener('keyup', e => keys[e.code] = false);
  canvas.addEventListener('mousemove', onMM);
  canvas.addEventListener('click', onCK);

  buildPanel();
  requestAnimationFrame(loop);
  toast(`Welcome, ${player.name}! Press E near an agent to talk 👋`);
}

function resize() {
  const cw = document.getElementById('cw');
  W = canvas.width = cw.clientWidth;
  H = canvas.height = cw.clientHeight;
}

// ════════════════════════════════════════════════════════
//  MAIN LOOP
// ════════════════════════════════════════════════════════
const SPD = 3.5;
const TALK_RANGE = 80; // pixels in world space

function loop(t) {
  const dt = Math.min(t - lastT, 33); lastT = t;

  // Player movement
  let dx = 0, dy = 0;
  if (keys['KeyW'] || keys['ArrowUp'])    dy = -1;
  if (keys['KeyS'] || keys['ArrowDown'])  dy = 1;
  if (keys['KeyA'] || keys['ArrowLeft'])  dx = -1;
  if (keys['KeyD'] || keys['ArrowRight']) dx = 1;
  plDanceTimer = Math.max(0, plDanceTimer - dt);
  if (plDanceTimer <= 0) plDancing = false;
  plChatTimer = Math.max(0, plChatTimer - dt);
  const moving = !!(dx || dy);
  plX = Math.max(20, Math.min(FW - 20, plX + dx * SPD));
  plY = Math.max(20, Math.min(FH - 20, plY + dy * SPD));
  if (moving) plDancing = false;
  plState = plDancing ? 'talking' : (moving ? 'walking' : 'idle');
  plTick += dt * 0.06;

  // Find nearest NPC in talk range
  let closestNPC = null, closestD = TALK_RANGE;
  npcs.forEach(n => {
    const d = Math.hypot(n.x - plX, n.y - plY);
    if (d < closestD) { closestD = d; closestNPC = n; }
  });
  nearbyNPC = closestNPC;

  // Smooth camera
  camX += (plX - W/2 - camX) * 0.09;
  camY += (plY - H/2 - camY) * 0.09;
  camX = Math.max(0, Math.min(FW - W, camX));
  camY = Math.max(0, Math.min(FH - H, camY));

  // Update NPCs (frozen while talking to them)
  npcs.forEach(n => {
    if (talkTarget && n.a.id === talkTarget.a.id) {
      n.state = 'talking'; n.tick += dt * 0.06;
    } else {
      n.update(dt, npcs);
    }
  });

  // Render
  const ci = Math.round(camX), cj = Math.round(camY);
  renderOffice(ctx, ci, cj, W, H);

  // Depth sort + render chars
  const entities = [
    ...npcs.map(n => ({ y: n.y, draw: () => renderChar(ctx, n, ci, cj) })),
    { y: plY, draw: () => renderPlayer(ctx, ci, cj) },
  ];
  entities.sort((a, b) => a.y - b.y).forEach(e => e.draw());

  // Draw speech bubbles on top
  drawBubbles(ctx, ci, cj);

  // [E] talk prompt above nearby NPC
  if (nearbyNPC && !talkTarget) {
    const nx = nearbyNPC.x - ci;
    const ny = nearbyNPC.y - cj - CH_DRAW - 40;
    const divCol = DIVS[nearbyNPC.a.div]?.color || '#fff';
    ctx.fillStyle = 'rgba(5,6,12,.96)';
    rr(ctx, nx - 36, ny - 12, 72, 22, 6); ctx.fill();
    ctx.strokeStyle = divCol; ctx.lineWidth = 1.5;
    rr(ctx, nx - 36, ny - 12, 72, 22, 6); ctx.stroke();
    ctx.fillStyle = divCol;
    ctx.font = 'bold 10px Outfit'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('[E] Talk', nx, ny - 1);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }

  requestAnimationFrame(loop);
}

// ════════════════════════════════════════════════════════
//  MOUSE
// ════════════════════════════════════════════════════════
function onMM(e) {
  const r = canvas.getBoundingClientRect();
  const sx = (e.clientX - r.left) * (canvas.width / r.width);
  const sy = (e.clientY - r.top) * (canvas.height / r.height);
  const wx = sx + camX, wy = sy + camY;
  let found = null, best = 9999;
  npcs.forEach(n => {
    const d = Math.hypot(n.x - wx, n.y - wy);
    if (d < 48 && d < best) { best = d; found = n; }
  });
  hovA = found?.a || null;
  canvas.style.cursor = found ? 'pointer' : 'default';
  if (found) showPop(found.a, e.clientX, e.clientY);
  else document.getElementById('pop').classList.remove('on');
}

function showPop(a, mx, my) {
  const d = DIVS[a.div];
  const oc = makeSmallCanvas(a, 40);
  const ava = document.getElementById('popAva');
  ava.innerHTML = ''; ava.appendChild(oc);
  document.getElementById('popNm').textContent = a.name;
  document.getElementById('popRl').textContent = a.role + ' · ' + d.label;
  document.getElementById('popTxt').textContent = a.identity;
  document.getElementById('popTags').innerHTML = a.stack.split('·').slice(0, 3).map(t =>
    `<span class="ptag" style="background:${d.color}18;color:${d.color}">${t.trim()}</span>`).join('');
  const inM = meeting.find(m => m.id === a.id);
  document.getElementById('popAdd').textContent = inM ? '★ In Meeting' : 'Add to Meeting';
  document.getElementById('popAdd').onclick = () => toggleM(a.id);
  document.getElementById('popInfo').onclick = () => openTalk(npcs.find(n=>n.a.id===a.id));
  const pop = document.getElementById('pop');
  let lx = mx + 14, ly = my - 80;
  if (lx + 220 > window.innerWidth) lx = mx - 232;
  if (ly < 8) ly = my + 18;
  if (ly + 280 > window.innerHeight) ly = window.innerHeight - 285;
  pop.style.left = lx + 'px'; pop.style.top = ly + 'px';
  pop.classList.add('on');
}

function onCK(e) {
  if (hovA) openTalk(npcs.find(n => n.a.id === hovA.id));
}

// ════════════════════════════════════════════════════════
//  TALK SYSTEM  — real chat with agent via Claude API
// ════════════════════════════════════════════════════════
const talkHistory = new Map(); // agentId → [{role,content}]

function openTalk(npc) {
  if (!npc) return;
  talkTarget = npc;
  document.getElementById('pop').classList.remove('on');
  const a = npc.a;
  const d = DIVS[a.div];

  // Avatar
  const ava = document.getElementById('talkAva');
  ava.innerHTML = '';
  const oc = makeSmallCanvas(a, 44);
  ava.appendChild(oc);

  document.getElementById('talkName').textContent = a.name;
  document.getElementById('talkRole').style.color = d.color;
  document.getElementById('talkRole').textContent = a.role + ' · ' + d.label;

  // Load history
  if (!talkHistory.has(a.id)) talkHistory.set(a.id, []);
  renderTalkHistory(a.id);

  const dlg = document.getElementById('talkDlg');
  dlg.style.display = 'flex';
  document.getElementById('talkInput').focus();

  // Greeting if first time
  if (talkHistory.get(a.id).length === 0) {
    appendTalkMsg(a.id, 'assistant',
      `Hey! I'm ${a.name}. ${a.identity} What can I help you with?`);
  }
}

function closeTalk() {
  talkTarget = null;
  document.getElementById('talkDlg').style.display = 'none';
}

function appendTalkMsg(agentId, role, content) {
  const hist = talkHistory.get(agentId);
  hist.push({ role, content });
  renderTalkHistory(agentId);
}

function renderTalkHistory(agentId) {
  const hist = talkHistory.get(agentId) || [];
  const box = document.getElementById('talkHistory');
  box.innerHTML = hist.map(m => {
    const isUser = m.role === 'user';
    return `<div style="display:flex;justify-content:${isUser?'flex-end':'flex-start'}">
      <div style="max-width:82%;padding:8px 11px;border-radius:${isUser?'12px 12px 2px 12px':'12px 12px 12px 2px'};
        background:${isUser?'rgba(255,255,255,.12)':'rgba(255,255,255,.05)'};
        border:1px solid ${isUser?'rgba(255,255,255,.14)':'rgba(255,255,255,.07)'};
        font-size:12px;line-height:1.6;color:${isUser?'#eceaf8':'rgba(236,234,248,.82)'}">
        ${escHtml(m.content)}
      </div>
    </div>`;
  }).join('');
  box.scrollTop = box.scrollHeight;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function sendTalk() {
  if (!talkTarget) return;
  const input = document.getElementById('talkInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  const a = talkTarget.a;
  appendTalkMsg(a.id, 'user', text);

  // Show typing indicator
  const hist = talkHistory.get(a.id);

  // Build system prompt
  const sys = `You are ${a.name}, a ${a.role} at a virtual AI agency. Stay fully in character.

Identity: ${a.identity}
Mission: ${a.mission}
Stack: ${a.stack}
Critical Rules:
${a.rules.map(r=>'- '+r).join('\n')}

Keep replies short (2-4 sentences max). Be helpful, direct, and in character. Don't mention you are an AI. You are a real team member.`;

  // Typing bubble on NPC
  talkTarget.chatText = '...';
  talkTarget.chatTimer = 999;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 200,
        system: sys,
        messages: hist.filter(m => m.role === 'user' || m.role === 'assistant')
          .slice(-10)
          .map(m => ({ role: m.role, content: m.content })),
      }),
    });
    const data = await res.json();
    const reply = data.content?.[0]?.text || 'Sorry, I missed that — try again?';
    talkTarget.chatText = reply.slice(0, 80) + (reply.length > 80 ? '…' : '');
    talkTarget.chatTimer = 420; // 7s
    appendTalkMsg(a.id, 'assistant', reply);
  } catch (err) {
    talkTarget.chatText = '';
    talkTarget.chatTimer = 0;
    appendTalkMsg(a.id, 'assistant', 'Having trouble connecting — try again!');
  }
}

function openMod(a) {
  selA = a;
  const d = DIVS[a.div];
  const inM = meeting.find(m => m.id === a.id);
  const box = document.getElementById('amBox');
  box.innerHTML = `
    <div class="am-t">
      <div class="am-fig" style="background:${d.color}0d" id="amFig"></div>
      <div style="flex:1">
        <div class="am-n">${a.name}</div>
        <div class="am-d" style="color:${d.color}">${d.label} · ${a.role}</div>
        <div class="am-s">${a.stack}</div>
      </div>
      <button class="am-x" onclick="cmod({target:document.getElementById('amod')})">✕</button>
    </div>
    <div class="am-sl">Identity</div>
    <div class="am-id">"${a.identity}"</div>
    <div class="am-sl">Mission</div>
    <div style="font-size:11px;color:rgba(236,234,248,.5);line-height:1.7">${a.mission}</div>
    <div class="am-sl">Critical Rules</div>
    ${a.rules.map(r=>`<div class="am-ru">${r}</div>`).join('')}
    <div class="am-sl">Deliverables</div>
    ${a.deliverables.map(dv=>`<div class="am-dl">${dv}</div>`).join('')}
    <div class="am-f">
      <button class="ambt ${inM?'r':'p'}" id="amtb" onclick="toggleM('${a.id}');refreshAMB('${a.id}')">${inM?'✕ Remove':'★ Add to Meeting'}</button>
      <button class="ambt s" onclick="cmod({target:document.getElementById('amod')})">Close</button>
    </div>`;
  const fig = document.getElementById('amFig');
  if (fig) { const oc = makeSmallCanvas(a, 64); fig.appendChild(oc); }
  document.getElementById('amod').classList.add('on');
  if (activeTab === 'info') buildPanel();
}

function refreshAMB(id) {
  const inM = meeting.find(m => m.id === id);
  const b = document.getElementById('amtb');
  if (b) { b.className = 'ambt ' + (inM ? 'r' : 'p'); b.textContent = inM ? '✕ Remove' : '★ Add to Meeting'; }
}
function cmod(e) { if (e.target === document.getElementById('amod')) document.getElementById('amod').classList.remove('on'); }

// ════════════════════════════════════════════════════════
//  PANEL
// ════════════════════════════════════════════════════════
function swt(tab, el) {
  activeTab = tab;
  document.querySelectorAll('.ptt').forEach(t => t.classList.remove('on'));
  el.classList.add('on'); buildPanel();
}

function buildPanel() {
  const b = document.getElementById('pbody');
  if (activeTab === 'agents') {
    const grouped = {};
    AGENTS.forEach(a => { if (!grouped[a.div]) grouped[a.div] = []; grouped[a.div].push(a); });
    b.innerHTML = '';
    Object.entries(grouped).forEach(([div, list]) => {
      const d = DIVS[div];
      const s = document.createElement('div');
      s.innerHTML = `<div class="dh"><div class="dd" style="background:${d.color}"></div><div class="dl" style="color:${d.color}">${d.label}</div><div class="dc">${list.length}</div></div>`;
      list.forEach(a => {
        const inM = meeting.find(m => m.id === a.id);
        const row = document.createElement('div');
        row.className = `ar${inM ? ' im' : ''}`;
        const figWrap = document.createElement('div');
        figWrap.className = 'ar-f';
        const oc = makeSmallCanvas(a, 28);
        figWrap.appendChild(oc);
        row.appendChild(figWrap);
        row.innerHTML += `<div class="ar-i"><div class="ar-n">${a.name}</div><div class="ar-r">${a.role}</div></div>
          <button class="ar-a${inM ? ' on' : ''}" onclick="event.stopPropagation();toggleM('${a.id}')">${inM ? '★' : '+'}</button>`;
        row.onclick = () => openMod(a);
        s.appendChild(row);
      });
      b.appendChild(s);
    });
  } else if (activeTab === 'meeting') {
    if (!meeting.length) { b.innerHTML = `<div class="me">Walk near an agent, press E to talk,<br>or use + to add them to your session.<br>Up to 8 can join.</div>`; return; }
    b.innerHTML = '';
    meeting.forEach(a => {
      const d = DIVS[a.div];
      const row = document.createElement('div');
      row.className = 'ms';
      const bar = document.createElement('div'); bar.className = 'ms-b'; bar.style.background = d.color;
      const fig = document.createElement('div'); fig.className = 'ms-f';
      const oc = makeSmallCanvas(a, 28); fig.appendChild(oc);
      row.appendChild(bar); row.appendChild(fig);
      row.innerHTML += `<div class="ms-i"><div class="ms-n">${a.name}</div><div class="ms-r">${a.role}</div></div>
        <button class="ms-x" onclick="toggleM('${a.id}')">✕</button>`;
      b.appendChild(row);
    });
    const lb = document.createElement('button');
    lb.className = 'ml'; lb.textContent = '⚡ Launch Session'; lb.onclick = openMov;
    b.appendChild(lb);
  } else {
    if (!selA) { b.innerHTML = `<div class="me">Click or press E near an agent<br>to see their profile.</div>`; return; }
    const a = selA, d = DIVS[a.div], inM = meeting.find(m => m.id === a.id);
    b.innerHTML = '';
    const ic = document.createElement('div'); ic.className = 'ic';
    const figDiv = document.createElement('div'); figDiv.className = 'if'; figDiv.style.background = d.color + '0d';
    const oc = makeSmallCanvas(a, 64); figDiv.appendChild(oc);
    ic.appendChild(figDiv);
    ic.innerHTML += `<div class="in">${a.name}</div><div class="ir" style="color:${d.color}">${a.role} · ${d.label}</div>
      <div class="isep"></div>
      <div class="ilbl">Identity</div>
      <div class="itxt" style="font-style:italic;margin-bottom:8px">"${a.identity}"</div>
      <div class="ilbl">Stack</div>
      <div style="display:flex;flex-wrap:wrap;gap:3px;margin-bottom:8px">${a.stack.split('·').map(t => `<span class="ptag" style="background:${d.color}18;color:${d.color};font-size:8px;padding:2px 6px;border-radius:20px;font-weight:700">${t.trim()}</span>`).join('')}</div>
      <div class="ilbl">Rules</div>
      ${a.rules.map(r => `<div class="irule">${r}</div>`).join('')}
      <div class="isep"></div>
      <div class="ilbl">Deliverables</div>
      <div class="itxt">${a.deliverables.map(x => `→ ${x}`).join('<br>')}</div>
      <button class="ibtn${inM ? ' on' : ''}" onclick="toggleM('${a.id}');buildPanel()">${inM ? '★ In Meeting — Remove' : '+ Add to Meeting'}</button>`;
    b.appendChild(ic);
  }
}

// ════════════════════════════════════════════════════════
//  MEETING — agents physically walk to meeting room
// ════════════════════════════════════════════════════════
const MEETING_ZONE = ZONES.find(z => z.id === 'meeting');
const MEETING_SEATS = (() => {
  // 14 seats arranged around the meeting table (mirror of drawMeetingTable layout)
  const z = ZONES.find(z => z.id === 'meeting');
  const tx = z.x + 70, ty = z.y + 130, tw = 480, th = 248;
  return [
    {x:tx+55,  y:ty-30},  {x:tx+150, y:ty-30},  {x:tx+245, y:ty-30},
    {x:tx+340, y:ty-30},  {x:tx+435, y:ty-30},
    {x:tx+55,  y:ty+th+30},{x:tx+150,y:ty+th+30},{x:tx+245,y:ty+th+30},
    {x:tx+340, y:ty+th+30},{x:tx+435,y:ty+th+30},
    {x:tx-32,  y:ty+65},  {x:tx-32,  y:ty+160},
    {x:tx+tw+32,y:ty+65}, {x:tx+tw+32,y:ty+160},
  ];
})();

function toggleM(id) {
  const a = AGENTS.find(x => x.id === id);
  if (!a) return;
  const i = meeting.findIndex(m => m.id === id);
  if (i >= 0) {
    meeting.splice(i, 1);
    toast(`${a.name} left the meeting`);
    // Send NPC back to desk
    const npc = npcs.find(n => n.a.id === id);
    if (npc) {
      npc.inMeeting = false;
      npc.state = 'walking';
      npc.tx = npc.dx; npc.ty = npc.dy;
      npc.stateCD = 200;
    }
  } else {
    if (meeting.length >= 8) { toast('Meeting full (8 max)'); return; }
    meeting.push(a);
    toast(`${a.name} heading to meeting room`);
    // Send NPC walking to their meeting seat
    const npc = npcs.find(n => n.a.id === id);
    if (npc) {
      npc.inMeeting = true;
      const seat = MEETING_SEATS[meeting.length - 1] || MEETING_SEATS[0];
      npc.state = 'walking';
      npc.tx = seat.x; npc.ty = seat.y;
      npc.meetSeat = seat;
      npc.stateCD = 600;
    }
  }
  document.getElementById('mpct').textContent = meeting.length ? `${meeting.length} in session` : 'Meeting Room';
  buildPanel();
}

function openMov() {
  if (!meeting.length) { toast('Add agents first'); return; }
  document.getElementById('movH').textContent = `${meeting.length} Agent${meeting.length > 1 ? 's' : ''} Assembled`;
  const row = document.getElementById('movRow');
  row.innerHTML = '';
  meeting.forEach(a => {
    const d = DIVS[a.div];
    const c = document.createElement('div');
    c.className = 'mo-c'; c.style.borderColor = d.color + '22';
    const fig = document.createElement('div'); fig.className = 'mo-cf';
    const oc = makeSmallCanvas(a, 44); fig.appendChild(oc);
    c.appendChild(fig);
    c.innerHTML += `<div class="mo-cn">${a.name}</div><div class="mo-cr">${a.role}</div>`;
    c.onclick = () => { toggleM(a.id); if (meeting.length > 0) openMov(); else closeMov(); };
    row.appendChild(c);
  });
  document.getElementById('mov').classList.add('on');
}

function closeMov() { document.getElementById('mov').classList.remove('on'); }

function copyPr() {
  const task = document.getElementById('movTa').value.trim();
  const block = meeting.map(a =>
    `## ${a.name} — ${a.role} (${DIVS[a.div].label})\n**Identity:** ${a.identity}\n**Mission:** ${a.mission}\n**Stack:** ${a.stack}\n**Rules:**\n${a.rules.map(r => '- ' + r).join('\n')}\n**Deliverables:** ${a.deliverables.join(', ')}`
  ).join('\n\n---\n\n');
  const pr = `You are a specialized team assembled by Wassim Omran.\n\n${block}\n\n---\n\n${task ? `## TASK\n${task}` : 'Introduce yourselves and ask what Wassim needs.'}`;
  navigator.clipboard.writeText(pr).then(() => toast('✅ Team prompt copied!'));
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('on'), 2600);
}

buildSplash();
</script>
</body>
</html>
